apiVersion: 1

# Every alert goes to #t4a-server as the "t4a server" Slack app (servers/alerts/README.md).
# SLACK_BOT_TOKEN comes from /etc/t4a-slack.env.
contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-t4a-server
        type: slack
        settings:
          recipient: t4a-server
          token: $SLACK_BOT_TOKEN
          title: '{{ if eq .Status "firing" }}:red_circle:{{ else }}:large_green_circle:{{ end }} {{ .CommonLabels.alertname }}'
          text: |-
            {{ range .Alerts }}{{ if eq .Status "firing" }}• {{ else }}• resolved: {{ end }}{{ .Annotations.summary }}
            {{ end }}

policies:
  - orgId: 1
    receiver: slack
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
