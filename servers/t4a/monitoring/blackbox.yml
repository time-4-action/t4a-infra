# Probe modules for targets/sites.yml.
modules:
  # Health check or page that must answer 2xx (redirects followed).
  http_2xx:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      fail_if_ssl: false
      fail_if_not_ssl: true

  # Apps behind a login (Auth0, basic auth): they answer with a redirect or 401, which means up.
  http_login:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      no_follow_redirects: true
      valid_status_codes: [200, 301, 302, 303, 307, 308, 401]
      fail_if_not_ssl: true
