# Every site and API checked from outside every 30 s; Prometheus re-reads this file on change.
# `name` is what dashboards and Slack alerts show; `host` is the server it runs on today.
# module: http_2xx (must answer 2xx) or http_login (redirect/401 to a login counts as up).

