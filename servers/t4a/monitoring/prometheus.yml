# Prometheus on t4a. Host and container metrics are not scraped here: Alloy on each server pushes
# them (remote write). This scrapes what lives on t4a's Docker networks, and the blackbox probes.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: { server: hetzner }

  # Every request through Traefik, per router (app), entrypoint and service: rate, status, latency.
  - job_name: traefik
    static_configs:
      - targets: [traefik:8082]
        labels: { server: hetzner }

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels: { server: hetzner, instance: shared-postgres }

  - job_name: mariadb
    static_configs:
      - targets: [mariadb-exporter:9104]
        labels: { server: hetzner, instance: mariadb }

  - job_name: loki
    static_configs:
      - targets: [loki:3100]
        labels: { server: hetzner }

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
        labels: { server: hetzner }

  # Sites and APIs checked from outside, every 30 s (targets/sites.yml).
  - job_name: sites
    metrics_path: /probe
    file_sd_configs:
      - files: [/etc/prometheus/targets/sites.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
