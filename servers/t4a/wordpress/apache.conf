# Apache settings shared by every WordPress site on t4a, mounted read-only into each container as
# /etc/apache2/conf-enabled/zz-t4a.conf (see _template/compose.yml). The same protections nginx
# gave the sites on t2. Change it here, copy it to /srv/wordpress/apache.conf, then
# `docker compose restart` in each site's folder.

# Real visitor IP. Traefik only accepts Cloudflare (cloudflare-only middleware), and Cloudflare
# sets CF-Connecting-IP, so trust it when the request comes from a Docker network (Traefik).
# X-Forwarded-For (the image's default) would give WordPress Cloudflare's IP for every visitor.
RemoteIPHeader CF-Connecting-IP
RemoteIPInternalProxy 172.16.0.0/12

# Never run PHP from uploads.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?i:php\d*|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# Config, readme and licence files; dotfiles and dot-folders except .well-known.
<FilesMatch "^(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|liesmich\.html)$">
    Require all denied
</FilesMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(?!well-known)">
    Require all denied
</DirectoryMatch>

# Long browser and Cloudflare caching for static files (nginx had `expires max`).
ExpiresActive On
<FilesMatch "\.(?i:css|js|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|pdf)$">
    ExpiresDefault "access plus 1 year"
</FilesMatch>

<IfModule !headers_module>
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

ServerTokens Prod
ServerSignature Off
