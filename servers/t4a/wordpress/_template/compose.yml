# One WordPress site on t4a. new-site.sh copies this into /srv/wordpress/<site>/ next to the
# site's .env (SITE, TRAEFIK_RULE, WORDPRESS_DB_*), php.ini and html/ (the WordPress files,
# backed up nightly with the rest of /srv). See servers/t4a/README.md in time-4-action/t4a-infra.
name: wp-${SITE}

services:
  wordpress:
    # The tag pins PHP; WordPress core lives in html/ and updates itself from wp-admin.
    image: wordpress:${WP_IMAGE_TAG:-7.1.3-php8.5-apache}
    restart: unless-stopped
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: mariadb
      # Cloudflare and Traefik terminate TLS; tell WordPress the request was HTTPS.
      # Only used when WordPress writes wp-config.php on first start.
      WORDPRESS_CONFIG_EXTRA: |
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - ./html:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/zz-site.ini:ro
    networks:
      - edge
      - mariadb
    mem_limit: 512m
    labels:
      - traefik.enable=true
      - traefik.http.routers.wp-${SITE}.rule=${TRAEFIK_RULE}
      - traefik.http.services.wp-${SITE}.loadbalancer.server.port=80
    logging:
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
    external: true
  mariadb:
    external: true
