# time-4-action.com and www: one static index.html, moved from t2 (README.md, "Website").
# Lives in /srv/website on t4a; the page itself is in /srv/website/html (not in git).
name: website

services:
  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    mem_limit: 64m
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.website.rule=Host(`time-4-action.com`) || Host(`www.time-4-action.com`)
      - traefik.http.services.website.loadbalancer.server.port=80

networks:
  edge:
    external: true
