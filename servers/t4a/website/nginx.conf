# Same rules as the t2 vhost (/etc/nginx/conf.d/time-4-action.com.conf there). Traefik terminates TLS.

# Apex → www
server {
    listen 80;
    server_name time-4-action.com;
    return 301 https://www.time-4-action.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.time-4-action.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dotfiles, except .well-known
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|gif|ico|jpeg|jpg|js|png|svg|webp|woff|woff2|ttf|eot|otf|mp4|webm)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
