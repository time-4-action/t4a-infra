<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back soon</title>
<style>
  :root { --bg: #fbfaf7; --text: #1f1e1b; --muted: #6b6860; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1a18; --text: #ecebe6; --muted: #a3a097; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; padding: 32px 16px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p { margin: 0 0 18px; }
  .sl { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>We'll be right back</h1>
  <p>{{message}}</p>
  <h1 class="sl" lang="sl">Kmalu smo nazaj</h1>
  <p class="sl" lang="sl">Stran začasno vzdržujemo. Poskusite znova čez nekaj minut.</p>
</main>
</body>
</html>
