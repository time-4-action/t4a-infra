# The /maintenance Slack command, banner.json for the apps and the down page. Lives in /srv/maintenance on t4a
# (servers/t4a/README.md). .env holds SLACK_SIGNING_SECRET and ALLOWED_USERS (Slack user IDs, comma separated).
name: maintenance

services:
  maintenance:
    image: node:24.22.0-alpine3.24
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    user: "1000:1000"
    env_file: .env
    environment:
      TZ: Europe/Ljubljana
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ./down.html:/app/down.html:ro
      - ./data:/data
      # Traefik's file provider picks up the down-mode router from here within a second.
      - /srv/edge/dynamic/maintenance.yml:/traefik/maintenance.yml
    mem_limit: 128m
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.maintenance.rule=Host(`maintenance.time-4-action.com`)
      - traefik.http.services.maintenance.loadbalancer.server.port=3000
      - traefik.http.services.maintenance.loadbalancer.healthcheck.path=/health

networks:
  edge:
    external: true
