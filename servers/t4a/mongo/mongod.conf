# MongoDB server settings for t4a (README.md). Sized for the five apps from t2 (under 500 MB of data)
# on a box that also runs Postgres, MariaDB and the apps. Logs go to stdout, so Alloy ships them to Loki.
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # t2 used 0.25. The container's limit is 1 GB; the rest is connections and the filesystem cache.
      cacheSizeGB: 0.5

net:
  port: 27017
  # All interfaces inside the container only: no port is published, so only the `mongo` network reaches it.
  bindIp: 0.0.0.0

security:
  authorization: enabled

# Operations over 500 ms go to the log; the profiler itself stays off.
operationProfiling:
  mode: "off"
  slowOpThresholdMs: 500
