# Cloudflare Origin Certificates, one folder per Cloudflare zone in /srv/edge/certs. Traefik picks one by SNI.
tls:
  options:
    default:
      minVersion: VersionTLS12
  certificates:
    - certFile: /certs/patrik-international.com/origin.pem
      keyFile: /certs/patrik-international.com/origin.key
    - certFile: /certs/time-4-action.com/origin.pem
      keyFile: /certs/time-4-action.com/origin.key
    - certFile: /certs/the-chase-project.com/origin.pem
      keyFile: /certs/the-chase-project.com/origin.key
