# One entry per app database. new-app-db.sh grants pghero CONNECT and adds pg_stat_statements;
# add the entry here by hand, then `docker compose restart` in /srv/pghero.
databases:
  jakamarinko:
    url: postgres://pghero:<%= ENV["PGHERO_DB_PASSWORD"] %>@postgres:5432/jakamarinko
    # The pghero role can't read table data, and EXPLAIN shouldn't be a way around that.
    explain: false
