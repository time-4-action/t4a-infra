# The server-wide Postgres, one database + role per app. Lives in /srv/postgres on t4a (infra/README.md).
# Not published on any port: apps reach it as `postgres:5432` over the `db` network.
name: postgres

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 256mb
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  db:
    name: db

volumes:
  pg_data:
