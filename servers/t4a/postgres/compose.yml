# The server-wide Postgres, one database + role per app. Lives in /srv/postgres on t4a (servers/t4a/README.md in time-4-action/t4a-infra).
# Not published on any port: apps reach it as `postgres:5432` over the `db` network.
name: postgres

services:
  postgres:
    build: .
    image: t4a/postgres:18.6-pgbackrest2.58
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    shm_size: 256mb
    # Postgres needs time for a clean shutdown; Docker's default 10 s ends in SIGKILL.
    stop_grace_period: 2m
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Storage Box key and known_hosts, owned by uid 70 (postgres) with mode 600.
      - ./pgbackrest-ssh:/etc/pgbackrest/ssh:ro
    networks:
      - db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: 10m
        max-file: "5"

networks:
  db:
    name: db

volumes:
  pg_data:
