# The whole server config for the shared Postgres on t4a (README.md). Replaces the
# initdb default in $PGDATA; values not set here are Postgres defaults.
# Sized for an 8 GB, 4 vCPU box that also runs the apps: Postgres gets about 1 GB
# of its own and counts on the page cache for the rest.

# Files. The config lives outside the data directory, so name the others.
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'

# Connections. Reachable only over the `db` Docker network, never a published port.
listen_addresses = '*'
max_connections = 100
idle_in_transaction_session_timeout = '10min'

# Memory
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
dynamic_shared_memory_type = posix
huge_pages = try
jit = off

# Disk (SSD)
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL and checkpoints
wal_level = replica
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Continuous archiving to the Storage Box (pgbackrest.conf). archive_timeout
# closes a WAL segment at least every 5 min, so a lost server costs at most that.
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 5min

# Query statistics: SELECT * FROM pg_stat_statements ORDER BY total_exec_time DESC
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
track_io_timing = on

# Logging, to stderr = `docker compose logs postgres`
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_checkpoints = on
log_timezone = UTC

# Locale, as initdb set it
timezone = UTC
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
