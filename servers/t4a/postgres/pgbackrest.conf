# pgBackRest: continuous WAL archiving plus base backups to the Hetzner Storage Box
# (README.md). The cipher passphrase comes from PGBACKREST_REPO1_CIPHER_PASS in
# /srv/postgres/.env; keep a copy outside t4a, without it the repo can't be read.
[global]
repo1-type=sftp
repo1-sftp-host=u578499.your-storagebox.de
repo1-sftp-host-port=23
repo1-sftp-host-user=u578499
repo1-sftp-private-key-file=/etc/pgbackrest/ssh/id_ed25519
repo1-sftp-public-key-file=/etc/pgbackrest/ssh/id_ed25519.pub
repo1-sftp-host-key-check-type=strict
repo1-sftp-host-key-hash-type=sha256
repo1-sftp-known-host=/etc/pgbackrest/ssh/known_hosts
# Absolute SFTP path: the Storage Box home is /home (restic uses /home/restic).
repo1-path=/home/pgbackrest/t4a-production
repo1-cipher-type=aes-256-cbc
# Two full backups (weekly), so any minute of the last 1-2 weeks can be restored.
repo1-retention-full=2

compress-type=zst
process-max=2
start-fast=y

# Push WAL in the background. If the Storage Box is unreachable, keep at most
# 4 GB of WAL on t4a and then drop it (breaking point-in-time recovery until the
# next full backup) rather than fill the disk and stop the database.
archive-async=y
spool-path=/var/lib/postgresql/pgbackrest/spool
archive-push-queue-max=4GiB

log-path=/var/lib/postgresql/pgbackrest/log
log-level-console=info
log-level-file=info

[main]
pg1-path=/var/lib/postgresql/18/docker
